name: HackSync Production CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-security-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun Environment
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: TypeScript Strict Typecheck
        run: bunx tsc --noEmit

      - name: Run Domain, RLS & Security Authorization Tests
        run: bun test

      - name: Validate SQL Migrations Syntax
        run: |
          for file in supabase/migrations/*.sql; do
            echo "Checking migration: $file"
            test -s "$file" || exit 1
          done

      - name: Production Bundle Build
        run: bun run build
