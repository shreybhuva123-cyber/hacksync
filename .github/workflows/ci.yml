name: HackSync Production CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same branch — prevents duplicate notifications
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-security-and-build:
    runs-on: ubuntu-latest

    env:
      # Public keys needed for Vite client build (safe to expose)
      VITE_SUPABASE_URL: https://qqyecjwhyjyryqykhcxa.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_R-3iTQYsV4f8KWKc38bwcA_4MV4rOrg

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun Environment
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: TypeScript Strict Typecheck
        run: bunx tsc --noEmit

      - name: Run Core Service Tests
        id: test_services
        continue-on-error: true
        run: bun test src/lib/services/__tests__/

      - name: Run HackSync AI Intelligence Test
        id: test_ai_intel
        continue-on-error: true
        run: bun test src/lib/hacksync/ai-intelligence.test.ts

      - name: Run Phase Tests - AI
        id: test_ai
        continue-on-error: true
        run: bun test src/tests/ai/

      - name: Run Phase Tests - Concurrency
        id: test_concurrency
        continue-on-error: true
        run: bun test src/tests/concurrency/

      - name: Run Phase Tests - Evaluation
        id: test_evaluation
        continue-on-error: true
        run: bun test src/tests/evaluation/

      - name: Run Phase Tests - Fixing
        id: test_fixing
        continue-on-error: true
        run: bun test src/tests/fixing/

      - name: Run Phase Tests - Git
        id: test_git
        continue-on-error: true
        run: bun test src/tests/git/

      - name: Run Phase Tests - Intelligence
        id: test_intelligence
        continue-on-error: true
        run: bun test src/tests/intelligence/

      - name: Run Phase Tests - Observability
        id: test_observability
        continue-on-error: true
        run: bun test src/tests/observability/

      - name: Run Phase Tests - Resilience
        id: test_resilience
        continue-on-error: true
        run: bun test src/tests/resilience/

      - name: Run Phase Tests - Security
        id: test_security
        continue-on-error: true
        run: bun test src/tests/security/

      - name: Run Phase Tests - Testing
        id: test_testing
        continue-on-error: true
        run: bun test src/tests/testing/

      - name: Run Phase Tests - UI
        id: test_ui
        continue-on-error: true
        run: bun test src/tests/ui/

      - name: Run Phase Tests - Validation
        id: test_validation
        continue-on-error: true
        run: bun test src/tests/validation/

      - name: Verify All Tests Passed
        run: |
          echo "=== TEST RESULTS ==="
          echo "Services:     ${{ steps.test_services.outcome }}"
          echo "AI Intel:     ${{ steps.test_ai_intel.outcome }}"
          echo "AI:           ${{ steps.test_ai.outcome }}"
          echo "Concurrency:  ${{ steps.test_concurrency.outcome }}"
          echo "Evaluation:   ${{ steps.test_evaluation.outcome }}"
          echo "Fixing:       ${{ steps.test_fixing.outcome }}"
          echo "Git:          ${{ steps.test_git.outcome }}"
          echo "Intelligence: ${{ steps.test_intelligence.outcome }}"
          echo "Observability:${{ steps.test_observability.outcome }}"
          echo "Resilience:   ${{ steps.test_resilience.outcome }}"
          echo "Security:     ${{ steps.test_security.outcome }}"
          echo "Testing:      ${{ steps.test_testing.outcome }}"
          echo "UI:           ${{ steps.test_ui.outcome }}"
          echo "Validation:   ${{ steps.test_validation.outcome }}"
          echo "===================="
          FAILED=0
          for outcome in \
            "${{ steps.test_services.outcome }}" \
            "${{ steps.test_ai_intel.outcome }}" \
            "${{ steps.test_ai.outcome }}" \
            "${{ steps.test_concurrency.outcome }}" \
            "${{ steps.test_evaluation.outcome }}" \
            "${{ steps.test_fixing.outcome }}" \
            "${{ steps.test_git.outcome }}" \
            "${{ steps.test_intelligence.outcome }}" \
            "${{ steps.test_observability.outcome }}" \
            "${{ steps.test_resilience.outcome }}" \
            "${{ steps.test_security.outcome }}" \
            "${{ steps.test_testing.outcome }}" \
            "${{ steps.test_ui.outcome }}" \
            "${{ steps.test_validation.outcome }}"; do
            if [ "$outcome" != "success" ]; then
              FAILED=1
            fi
          done
          if [ $FAILED -ne 0 ]; then
            echo "❌ One or more test groups failed!"
            exit 1
          fi
          echo "✅ All test groups passed!"

      - name: Dependency Security Audit
        run: bun pm ls --all 2>&1 | head -100
        continue-on-error: true

      - name: Validate SQL Migration Files
        run: |
          echo "Checking migration files are non-empty and contain valid SQL keywords..."
          FAILED=0
          for file in supabase/migrations/*.sql; do
            if [ ! -s "$file" ]; then
              echo "❌ EMPTY: $file"
              FAILED=1
              continue
            fi
            # Check for at least one SQL statement keyword
            if ! grep -qiE '(CREATE|ALTER|DROP|INSERT|UPDATE|DELETE|GRANT|REVOKE|SELECT)' "$file"; then
              echo "❌ NO SQL KEYWORDS: $file"
              FAILED=1
              continue
            fi
            echo "✅ $file"
          done
          if [ $FAILED -ne 0 ]; then exit 1; fi

      - name: Verify RLS Policy Security (Static Check)
        run: |
          echo "Checking that no migration after the security fix reintroduces self-insert..."
          # After 20260827100000, no migration should contain auth.uid() = user_id on INSERT
          # The fix migration itself (20260827100000) is excluded from this check
          FAILED=0
          shopt -s nullglob
          for file in supabase/migrations/202608271*.sql supabase/migrations/202608272*.sql supabase/migrations/202608[3-9]*.sql supabase/migrations/20261*.sql; do
            [ -f "$file" ] || continue
            # Skip the security fix migration itself — it mentions the pattern in comments
            case "$file" in *20260827100000*) continue ;; esac
            # Only check non-comment lines (strip lines starting with --)
            if grep -v '^[[:space:]]*--' "$file" | grep -q 'auth.uid() = user_id'; then
              if grep -v '^[[:space:]]*--' "$file" | grep -B5 'auth.uid() = user_id' | grep -qi 'INSERT'; then
                echo "❌ SECURITY REGRESSION: $file contains self-insert policy"
                FAILED=1
              fi
            fi
          done
          if [ $FAILED -ne 0 ]; then exit 1; fi
          echo "✅ No self-insert regressions detected"

      - name: Production Bundle Build
        run: bun run build
