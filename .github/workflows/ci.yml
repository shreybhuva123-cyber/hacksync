name: HackSync CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun Environment
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck TypeScript Codebase
        run: bunx tsc --noEmit

      - name: Run Domain & Security Test Suite
        run: bun test

      - name: Run Production Bundle Build
        run: bun run build
